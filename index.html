<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simplyver Home</title>

<style>
    body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: #f4f6f9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .card {
        background: white;
        padding: 30px;
        max-width: 400px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        text-align: center;
    }

    .card h2 {
        color: #0078D4;
        margin-bottom: 10px;
    }

    .card p {
        color: #555;
        line-height: 1.6;
    }

    .btn {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px;
        background: #0078D4;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        transition: background 0.2s ease;
    }

    .btn:hover {
        background: #106ebe;
    }
</style>
</head>

<body>
    <div class="card">
        <h2>Welcome!</h2>
        <p>
            <center>WELCOME TO SIMPLYVER.COM</center>
			<center>HOME OF SIMPLE SOLUTIONS FOR COMPLEX PROBLEMS</center>
			<br
        </p>
        <a>#COMING SOON!!</a>
    </div>
</body>
</html>
